```yaml
openapi: 3.0.3

info:
  title: Products API
  description: Simple REST API for managing products
  version: 1.0.0

servers:
  - url: http://localhost:8080

paths:

  /products:
    post:
      summary: Create a product
      operationId: createProduct

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'

      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

        '400':
          description: Invalid product data

    get:
      summary: Get all products
      operationId: getProducts

      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'

components:

  schemas:

    ProductRequest:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
          example: MacBook Pro
        price:
          type: number
          format: double
          example: 1999.99

    Product:
      type: object
      required:
        - id
        - name
        - price
      properties:
        id:
          type: string
          example: "101"
        name:
          type: string
          example: MacBook Pro
        price:
          type: number
          format: double
          example: 1999.99
```
